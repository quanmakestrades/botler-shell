<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0501; font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
  color: rgba(255,215,120,0.8); display: flex; height: 100vh; overflow: hidden;
  font-size: 12px;
}

/* ── Sidebar ── */
#sidebar {
  width: 220px; min-width: 180px; background: rgba(8,3,0,0.97);
  border-right: 1px solid rgba(255,160,40,0.1);
  display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
}
#sidebar-header {
  padding: 14px 12px 10px;
  font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase;
  color: rgba(255,160,40,0.3); border-bottom: 1px solid rgba(255,160,40,0.07);
  flex-shrink: 0;
}
#agent-list { overflow-y: auto; flex: 1; padding: 6px 0; }
.agent-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; cursor: pointer;
  border-left: 2px solid transparent;
  transition: background 0.15s; color: rgba(255,200,100,0.55);
}
.agent-item:hover { background: rgba(255,160,40,0.06); color: rgba(255,220,120,0.8); }
.agent-item.active {
  border-left-color: rgba(255,160,40,0.6);
  background: rgba(255,160,40,0.08); color: rgba(255,230,140,0.95);
}
.agent-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,160,40,0.25); flex-shrink: 0;
}
.agent-dot.up   { background: #4caf50; box-shadow: 0 0 4px #4caf50; }
.agent-dot.warn { background: #ff9800; box-shadow: 0 0 4px #ff9800; }
.agent-item-name { flex: 1; letter-spacing: 0.05em; }
.agent-item-model { font-size: 9px; color: rgba(255,160,40,0.3); }
#status-bar {
  padding: 7px 12px; font-size: 9px; letter-spacing: 0.2em;
  color: rgba(255,160,40,0.3); border-top: 1px solid rgba(255,160,40,0.07);
  flex-shrink: 0;
}
#gw-dot {
  display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,160,40,0.25); margin-right: 5px; vertical-align: middle;
}
#gw-dot.up { background: #4caf50; box-shadow: 0 0 4px #4caf50; }

/* ── Main explorer ── */
#main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
#explorer-header {
  display: flex; align-items: center; gap: 0;
  border-bottom: 1px solid rgba(255,160,40,0.08);
  flex-shrink: 0; background: rgba(10,4,0,0.8);
}
.breadcrumb {
  padding: 10px 16px; font-size: 11px;
  color: rgba(255,200,100,0.45); letter-spacing: 0.1em;
  flex: 1;
}
.breadcrumb span { color: rgba(255,160,40,0.3); margin: 0 5px; }
.breadcrumb .crumb { cursor: pointer; color: rgba(255,200,100,0.55); }
.breadcrumb .crumb:hover { color: rgba(255,230,140,0.9); }
#toolbar {
  display: flex; gap: 0; padding: 0 8px;
}
.tool-btn {
  background: none; border: none; color: rgba(255,160,40,0.35);
  padding: 8px 10px; cursor: pointer; font-size: 13px;
  transition: color 0.15s;
}
.tool-btn:hover { color: rgba(255,220,120,0.8); }

#file-pane {
  flex: 1; overflow: auto; padding: 4px 0;
}

/* File tree */
.tree-row {
  display: flex; align-items: center; gap: 0;
  padding: 3px 0; cursor: pointer; user-select: none;
  border-left: 2px solid transparent;
  transition: background 0.1s;
}
.tree-row:hover { background: rgba(255,160,40,0.05); }
.tree-row.selected { background: rgba(255,160,40,0.1); border-left-color: rgba(255,160,40,0.4); }
.tree-indent { display: inline-block; flex-shrink: 0; }
.tree-arrow {
  display: inline-block; width: 16px; text-align: center;
  color: rgba(255,160,40,0.3); font-size: 9px; flex-shrink: 0;
  transition: transform 0.15s;
}
.tree-arrow.open { transform: rotate(90deg); }
.tree-icon { width: 16px; flex-shrink: 0; text-align: center; font-size: 12px; }
.tree-name {
  flex: 1; color: rgba(255,215,120,0.8); letter-spacing: 0.03em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding-right: 8px;
}
.tree-name.dir { color: rgba(255,200,100,0.85); }
.tree-size { font-size: 9px; color: rgba(255,160,40,0.25); padding-right: 12px; flex-shrink: 0; }

/* File preview pane */
#preview-pane {
  width: 340px; min-width: 280px; border-left: 1px solid rgba(255,160,40,0.08);
  background: rgba(8,3,0,0.97); display: flex; flex-direction: column;
  overflow: hidden; flex-shrink: 0;
}
#preview-header {
  padding: 10px 14px; font-size: 9px; letter-spacing: 0.35em;
  text-transform: uppercase; color: rgba(255,160,40,0.3);
  border-bottom: 1px solid rgba(255,160,40,0.07); flex-shrink: 0;
}
#preview-content {
  flex: 1; overflow: auto; padding: 14px;
  font-size: 11px; line-height: 1.65;
  color: rgba(255,215,120,0.65); white-space: pre-wrap; word-break: break-word;
}
#preview-content.empty { color: rgba(255,160,40,0.2); font-style: italic; padding: 20px 14px; }

/* Agent info card (shows when agent selected, no file) */
#agent-card {
  padding: 20px 16px; display: none;
}
.ac-label { font-size: 9px; letter-spacing: 0.4em; text-transform: uppercase; color: rgba(255,160,40,0.3); margin-bottom: 4px; margin-top: 14px; }
.ac-label:first-child { margin-top: 0; }
.ac-value { color: rgba(255,215,120,0.65); font-size: 11px; word-break: break-all; }
.ac-badge {
  display: inline-block; font-size: 9px; letter-spacing: 0.2em;
  padding: 2px 8px; border-radius: 2px; border: 1px solid rgba(255,160,40,0.2);
  color: rgba(255,200,100,0.5); text-transform: uppercase;
}

/* Scrollbars */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,160,40,0.15); border-radius: 2px; }

/* Empty state */
.empty-state {
  padding: 40px 20px; text-align: center;
  color: rgba(255,160,40,0.2); font-size: 11px; letter-spacing: 0.2em;
}
</style>

// Gateway projects list (injected when gateway connects)
let PROJECTS = [];

// ── State ─────────────────────────────────────────────────────────────────────

let selectedPath = null;
let expandedDirs = new Set();
let gwConnected = false;
let gw = null;

// ── Gateway connection (reuse Botler's credentials) ───────────────────────────
const GW_URL   = localStorage.getItem('botler_gw_url')   || 'wss://stewartos-core.tail2d5e46.ts.net';
const GW_TOKEN = localStorage.getItem('botler_gw_token') || 'StewartOS-Core-2026';

function connectGateway() {
  try {
    const ws = new WebSocket(GW_URL);
    ws.onopen = () => {};
    ws.onclose = () => { gwConnected = false; updateGwStatus(); };
    ws.onmessage = ev => handleGwMsg(JSON.parse(ev.data), ws);
    ws.onerror = () => {};
    gw = ws;
  } catch(e) {}
}

const pending = new Map();
function gwRequest(ws, method, params) {
  return new Promise((res, rej) => {
    const id = crypto.randomUUID();
    pending.set(id, { res, rej });
    ws.send(JSON.stringify({ type: 'req', id, method, params }));
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); rej(new Error('timeout')); } }, 8000);
  });
}
function handleGwMsg(f, ws) {
  if (f.type === 'event' && f.event === 'connect.challenge') {
    gwRequest(ws, 'connect', {
      minProtocol: 3, maxProtocol: 3,
      client: { id: 'system-map', version: 'dev', displayName: 'System Map', platform: 'web', mode: 'webchat' },
      role: 'operator', scopes: ['operator.admin'],
      auth: GW_TOKEN ? { password: GW_TOKEN } : undefined, caps: [],
    }).then(() => { gwConnected = true; updateGwStatus(); loadGwData(ws); }).catch(() => {});
  }
  if (f.type === 'res') {
    const p = pending.get(f.id);
    if (p) { pending.delete(f.id); f.ok ? p.res(f.payload) : p.rej(new Error(f.error?.message || 'err')); }
  }
}
function updateGwStatus() {
  document.getElementById('gw-dot').className = gwConnected ? 'up' : '';
  document.getElementById('gw-label').textContent = gwConnected ? 'Gateway connected' : 'Offline — showing cached structure';
}
async function loadGwData(ws) {
  // Try to load projects list from botler_projects localStorage via parent frame
  try {
    const raw = window.parent?.localStorage?.getItem('botler_projects');
    if (raw) {
      PROJECTS = Object.values(JSON.parse(raw));
      if (PROJECTS.length) renderProjects();
    }
  } catch(e) {}
}

// ── Render ────────────────────────────────────────────────────────────────────
function init() {
  renderAgentList();
  updateGwStatus();
  connectGateway();
  // Load projects from parent window (if embedded in Botler panel)
  setTimeout(() => {
    try {
      const raw = window.parent?.localStorage?.getItem('botler_projects');
      if (raw) { PROJECTS = Object.values(JSON.parse(raw)); }
    } catch(e) {}
  }, 500);
}

function renderAgentList() {
  const list = document.getElementById('agent-list');
  list.innerHTML = '';
  for (const ag of AGENTS) {
    const item = document.createElement('div');
    item.className = 'agent-item' + (activeAgent?.id === ag.id ? ' active' : '');
    item.innerHTML = `
      <div class="agent-dot ${ag.status}"></div>
      <div class="agent-item-name">${ag.name}</div>
      <div class="agent-item-model">${ag.model.split('/').pop().replace('claude-','').replace('-4-','4.').slice(0,10)}</div>`;
    item.onclick = () => selectAgent(ag);
    list.appendChild(item);
  }
  // Projects section
  if (PROJECTS.length) {
    const sep = document.createElement('div');
    sep.style.cssText = 'font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,160,40,.2);padding:14px 12px 6px;border-top:1px solid rgba(255,160,40,.07);margin-top:6px;';
    sep.textContent = 'Projects';
    list.appendChild(sep);
    for (const proj of PROJECTS) {

      item.style.fontSize = '11px';
      item.innerHTML = `<div class="agent-dot"></div><div class="agent-item-name" style="color:rgba(255,200,100,.5)">📁 ${proj.name}</div>`;
      item.onclick = () => selectProject(proj);
      list.appendChild(item);
    }

}

function setBreadcrumb(crumbs) {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = crumbs.map((c, i) =>
    i < crumbs.length - 1
      ? `<span class="crumb" onclick="selectAgent(AGENTS.find(a=>a.id==='${c.id||''}'))">${c.label}</span><span> / </span>`
      : `<span>${c.label}</span>`
  ).join('');
}

// ── Tree rendering ────────────────────────────────────────────────────────────
function renderTree(nodes, basePath, currentPath) {
  const pane = document.getElementById('file-pane');
  pane.innerHTML = '';
  if (!nodes || nodes.length === 0) {
    pane.innerHTML = `<div class="empty-state">${gwConnected ? 'Empty workspace' : 'Structure not yet mapped.<br>Connect to gateway to explore.'}</div>`;
    return;
  }
  document.getElementById('empty-state')?.remove();
  renderNodes(pane, nodes, basePath, 0);
}

function renderNodes(parent, nodes, basePath, depth) {
  for (const node of nodes) {
    const fullPath = basePath + '/' + node.name;
    const isDir = node.type === 'dir';
    const isExpanded = expandedDirs.has(fullPath);

    const row = document.createElement('div');
    row.className = 'tree-row' + (selectedPath === fullPath ? ' selected' : '');
    row.dataset.path = fullPath;

    const indent = document.createElement('div');
    indent.className = 'tree-indent';
    indent.style.width = (depth * 16 + 6) + 'px';

    const arrow = document.createElement('div');
    arrow.className = 'tree-arrow' + (isExpanded ? ' open' : '');
    arrow.textContent = isDir ? '▶' : '';

    const icon = document.createElement('div');
    icon.className = 'tree-icon';
    icon.textContent = isDir ? (isExpanded ? '📂' : '📁') : getFileIcon(node.name);

    const name = document.createElement('div');
    name.className = 'tree-name' + (isDir ? ' dir' : '');
    name.textContent = node.name;
    if (node.desc) name.title = node.desc;

    const size = document.createElement('div');
    size.className = 'tree-size';
    size.textContent = node.desc ? '·' : '';
    size.title = node.desc || '';

    row.appendChild(indent);
    row.appendChild(arrow);
    row.appendChild(icon);
    row.appendChild(name);
    row.appendChild(size);
    parent.appendChild(row);

    row.onclick = (e) => {
      e.stopPropagation();
      selectedPath = fullPath;
      document.querySelectorAll('.tree-row.selected').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      if (isDir) {
        if (expandedDirs.has(fullPath)) {
          expandedDirs.delete(fullPath);
          arrow.classList.remove('open');
          icon.textContent = '📁';
          // Remove children
          let next = row.nextSibling;
          while (next && next.dataset?.depth > depth) {
            const n = next.nextSibling; next.remove(); next = n;
          }
          // Re-render children section cleanly
          refreshTree();
        } else {
          expandedDirs.add(fullPath);
          refreshTree();
        }
      } else {
        showFilePreview(node, fullPath);
      }
    };

    if (isDir && isExpanded && node.children?.length) {
      renderNodes(parent, node.children, fullPath, depth + 1);
    }
  }
}

function refreshTree() {
  if (!activeAgent) return;
  renderTree(activeAgent.knownTree, activeAgent.workspace, '');
}

function collapseAll() {
  expandedDirs.clear();
  refreshTree();
}

function showFilePreview(node, path) {
  const header = document.getElementById('preview-header');
  const content = document.getElementById('preview-content');
  header.textContent = node.name;
  content.className = '';

  const ext = node.name.split('.').pop().toLowerCase();
  let display = path + '\n\n';
  if (node.desc) display += '// ' + node.desc + '\n\n';

  if (ext === 'md') {
    content.textContent = display + '(Markdown — connect to gateway to view contents)';
  } else if (ext === 'html') {
    content.textContent = display + '(HTML file — open in Botler panel to preview)';
  } else if (ext === 'json' && node.name === 'google_credentials.json') {
    content.textContent = display + '⚠ This file contains secrets.\nDownload from GCP → IAM & Admin → Service Accounts → Keys → Add Key → JSON';
  } else {
    content.textContent = display + '(Connect to gateway to view file contents)';
  }
  document.getElementById('agent-card').style.display = 'none';
}

function getFileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const icons = { html: '🌐', js: '⚡', ts: '⚡', py: '🐍', md: '📝', json: '📋', toml: '⚙', sh: '📜', css: '🎨', mjs: '⚡', txt: '📄', csv: '📊' };
  return icons[ext] || '📄';
}

function openInBotler() {
  if (activeAgent) {
    window.parent?.postMessage({ type: 'botler_open_agent', agentId: activeAgent.id }, '*');
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
