[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Edge function for Anthropic streaming (SSE requires edge runtime)
[[edge_functions]]
  path = "/api/stream"
  function = "stream"

# Browse proxy — strips X-Frame-Options so external pages load in Botler's panel
[[edge_functions]]
  path = "/api/browse"
  function = "browse"

# Netlify Function for YouTube search
[[redirects]]
  from = "/api/yt-search"
  to = "/.netlify/functions/yt-search"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/finance"
  to = "/finance/index.html"
  status = 200

[[redirects]]
  from = "/finance/*"
  to = "/finance/:splat"
  status = 200

[[redirects]]
  from = "/homeschool"
  to = "/homeschool/index.html"
  status = 200

[[redirects]]
  from = "/homeschool/*"
  to = "/homeschool/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
