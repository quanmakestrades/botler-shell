[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/finance"
  to = "/finance/index.html"
  status = 200

[[redirects]]
  from = "/finance/*"
  to = "/finance/:splat"
  status = 200

[[redirects]]
  from = "/homeschool"
  to = "/homeschool/index.html"
  status = 200

[[redirects]]
  from = "/homeschool/*"
  to = "/homeschool/:splat"
  status = 200
