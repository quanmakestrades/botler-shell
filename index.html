<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Botler</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #1a0800; font-family: 'Georgia', serif; }
  body > canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
  #hud, #controls, #edit-btn, #edit-ui, #gw-dot, #transcript-panel, #text-input-wrap, #tool-panel { z-index: 1; }

  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 32px 0 28px; }
  #status { color: rgba(255,200,100,0.32); font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase; pointer-events: none; }
  #name-tag { color: rgba(255,200,100,0.16); font-size: 11px; letter-spacing: 0.62em; text-transform: uppercase; }

  /* ─── Gateway status dot ─── */
  #gw-dot {
    position: fixed; top: 20px; left: 24px; width: 8px; height: 8px;
    border-radius: 50%; background: #442200; border: 1px solid rgba(255,160,40,0.2);
    transition: background 0.4s, box-shadow 0.4s; cursor: pointer; z-index: 5;
  }
  #gw-dot.connected { background: #44cc44; box-shadow: 0 0 6px #44cc44; }
  #gw-dot.connecting { background: #cc8800; box-shadow: 0 0 6px #cc8800; animation: pulse-dot 1s infinite; }
  @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  /* ─── Transcript ─── */
  #transcript-panel {
    position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%);
    max-width: min(460px, 88vw); min-height: 32px; text-align: center;
    color: rgba(255,215,120,0.82); font-size: 13px; line-height: 1.6;
    letter-spacing: 0.04em; pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.8);
    transition: opacity 0.5s;
  }
  #transcript-panel.tool-msg { color: rgba(255,180,60,0.55); font-size: 11px; letter-spacing: 0.12em; font-style: italic; }

  /* ─── Text input ─── */
  #text-input-wrap {
    position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; width: min(400px, 86vw);
  }
  #text-input {
    flex: 1; background: rgba(255,140,20,0.06); border: 1px solid rgba(255,160,40,0.22);
    color: rgba(255,220,120,0.9); font-family: 'Georgia', serif; font-size: 11px;
    letter-spacing: 0.15em; padding: 6px 10px; border-radius: 2px; outline: none;
  }
  #text-input::placeholder { color: rgba(255,180,60,0.28); }
  #text-send {
    background: rgba(255,160,40,0.08); border: 1px solid rgba(255,160,40,0.22);
    color: rgba(255,200,100,0.55); font-family: 'Georgia', serif; font-size: 10px;
    letter-spacing: 0.3em; text-transform: uppercase; padding: 6px 12px;
    border-radius: 2px; cursor: pointer; transition: background 0.25s, color 0.25s;
  }
  #text-send:hover { background: rgba(255,160,40,0.18); color: rgba(255,220,120,0.9); }

  /* ─── Tool panel ─── */
  #tool-panel {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: rgba(15,5,0,0.97); border: 1px solid rgba(255,160,40,0.3);
    border-radius: 6px; padding: 20px; width: min(480px, 90vw); max-height: 70vh;
    overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.8); z-index: 20;
  }
  #tool-panel.open { display: block; }
  #tool-panel-title {
    color: rgba(255,200,100,0.7); font-size: 10px; letter-spacing: 0.4em;
    text-transform: uppercase; margin-bottom: 14px;
  }
  #tool-panel-body { color: rgba(255,215,120,0.8); font-size: 12px; line-height: 1.7; }
  #tool-panel-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; color: rgba(255,180,60,0.5);
    font-size: 16px; cursor: pointer; font-family: 'Georgia', serif;
  }
  .tool-list-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,160,40,0.08);
  }
  .tool-list-item:last-child { border-bottom: none; }
  .tool-item-check { color: rgba(255,180,60,0.6); font-size: 13px; margin-top: 1px; }
  .tool-item-text { flex: 1; color: rgba(255,215,120,0.75); font-size: 12px; }
  .finance-locked { color: rgba(255,80,40,0.6); font-size: 10px; letter-spacing: 0.2em; }

  #controls { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; pointer-events: all; flex-wrap: wrap; justify-content: center; }
  .btn { background: rgba(255,160,40,0.08); border: 1px solid rgba(255,160,40,0.22); color: rgba(255,200,100,0.55); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; padding: 6px 14px; border-radius: 2px; cursor: pointer; font-family: 'Georgia', serif; transition: background 0.25s, color 0.25s; }
  .btn:hover, .btn.active { background: rgba(255,160,40,0.18); color: rgba(255,220,120,0.9); }

  /* ─── Dropdowns ─── */
  .dropdown { position: relative; display: inline-block; }
  .dropdown-menu {
    display: none; position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%); background: rgba(20,8,0,0.96);
    border: 1px solid rgba(255,160,40,0.3); border-radius: 4px; padding: 8px 0;
    min-width: 120px; box-shadow: 0 4px 24px rgba(0,0,0,0.7); z-index: 10;
  }
  .dropdown-menu.open { display: block; }
  .dropdown-menu a {
    color: rgba(255,200,100,0.55); padding: 6px 15px; text-decoration: none;
    display: block; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
    font-family: 'Georgia', serif; transition: background 0.25s, color 0.25s;
  }
  .dropdown-menu a:hover { background: rgba(255,160,40,0.12); color: rgba(255,220,120,0.9); }
  .dropdown-menu a.active { background: rgba(255,160,40,0.18); color: rgba(255,220,120,0.9); }

  #edit-btn { position: fixed; top: 20px; right: 24px; pointer-events: all; }

  /* ─── Color Picker ─── */
  #color-btn { position: relative; }
  #color-panel {
    display: none; position: absolute; bottom: calc(100% + 10px); left: 50%;
    transform: translateX(-50%); background: rgba(20,8,0,0.96);
    border: 1px solid rgba(255,160,40,0.3); border-radius: 4px; padding: 10px; width: 220px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.7);
  }
  #color-panel.open { display: block; }
  #color-swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .swatch { width: 22px; height: 22px; border-radius: 3px; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s, transform 0.15s; flex-shrink: 0; }
  .swatch:hover, .swatch.active { border-color: rgba(255,230,120,0.9); transform: scale(1.18); }
  #color-spectrum { width: 100%; height: 16px; border-radius: 3px; cursor: crosshair; background: linear-gradient(to right, #ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000); }
  #spectrum-label { color: rgba(255,200,100,0.4); font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; margin-top: 5px; text-align: center; }
  #edit-ui { display: none; position: fixed; inset: 0; pointer-events: none; }

  .e-box { position: absolute; pointer-events: all; cursor: ns-resize; border: 1px dashed rgba(255,180,50,0.55); background: rgba(255,140,20,0.04); min-height: 24px; min-width: 40px; }
  .e-handle { position: absolute; pointer-events: all; width: 11px; height: 11px; background: rgba(255,180,50,0.88); border: 1px solid rgba(255,230,120,1); transform: translate(-50%, -50%); border-radius: 2px; user-select: none; }
  .e-handle.round  { border-radius: 50%; width: 13px; height: 13px; }
  .e-handle.se     { cursor: se-resize; }
  .e-handle.move   { cursor: move; }
  .e-handle.ew     { cursor: ew-resize; }
  .e-handle.ns     { cursor: ns-resize; }
  .e-label { position: absolute; color: rgba(255,200,100,0.45); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; pointer-events: none; white-space: nowrap; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="gw-dot" title="Gateway" onclick="setGatewayUrl()"></div>

<div id="hud">
  <div id="status">Standby</div>
  <div id="name-tag">Botler</div>
</div>

<div id="transcript-panel"></div>

<div id="text-input-wrap">
  <input id="text-input" type="text" placeholder="Ask Botler…" autocomplete="off" spellcheck="false">
  <button id="text-send">Send</button>
</div>

<div id="controls">
  <div class="dropdown">
    <button class="btn" onclick="toggleDropdown(event, 'voice-dropdown')">Voice</button>
    <div class="dropdown-menu" id="voice-dropdown">
      <a href="#" data-state="idle"      onclick="setState('idle'); return false;">Idle</a>
      <a href="#" data-state="listening" onclick="setState('listening'); return false;">Listen</a>
      <a href="#" data-state="thinking"  onclick="setState('thinking'); return false;">Think</a>
      <a href="#" data-state="speaking"  onclick="setState('speaking'); return false;">Speak</a>
      <a href="#" data-state="pleased"   onclick="setState('pleased'); return false;">Pleased</a>
      <a href="#" onclick="setGatewayUrl(); return false;">Set Gateway…</a>
    </div>
  </div>

  <div class="dropdown">
    <button class="btn" onclick="toggleDropdown(event, 'looks-dropdown')">Looks</button>
    <div class="dropdown-menu" id="looks-dropdown">
      <a href="#" onclick="loadLook(); return false;">Load Look</a>
      <a href="#" onclick="saveLook(); return false;">Save Look</a>
      <a href="#" onclick="toggleColorPanel(event); return false;" id="color-picker-link">Color</a>
    </div>
  </div>

  <button class="btn" onclick="askBotler('greet the kids')">Greet Kids</button>
  <button class="btn" onclick="openToolPanel()">Tools</button>

  <div class="dropdown" id="color-btn">
    <div id="color-panel">
      <div id="color-swatches"></div>
      <canvas id="color-spectrum" width="200" height="16"></canvas>
      <div id="spectrum-label">drag for any hue</div>
    </div>
  </div>
</div>
<button id="edit-btn" class="btn" onclick="toggleEdit()">Edit</button>

<!-- Tool panel -->
<div id="tool-panel">
  <button id="tool-panel-close" onclick="closeToolPanel()">✕</button>
  <div id="tool-panel-title">Botler Tools</div>
  <div id="tool-panel-body"></div>
</div>

<div id="edit-ui">
  <div  id="mst-box"    class="e-box"></div>
  <div  id="mst-corner" class="e-handle se"   title="resize mustache width"></div>
  <div  id="mst-height" class="e-handle ns"   title="resize mustache height"></div>
  <div  id="eye-pos"    class="e-handle round move" title="move eyes"></div>
  <div  id="eye-sz"     class="e-handle ew"   title="eye size"></div>
  <div  id="mono-sz"    class="e-handle ns"   title="monocle size"></div>
  <div  id="lbl-mst"    class="e-label">mustache</div>
  <div  id="lbl-mh"     class="e-label">height</div>
  <div  id="lbl-eye"    class="e-label">eyes</div>
  <div  id="lbl-esz"    class="e-label">size</div>
  <div  id="lbl-mono"   class="e-label" style="transform:none;">monocle</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Constants ────────────────────────────────────────────────────────────────
function resolveGatewayUrl() {
  // Priority: ?gw=... query param (persists), then localStorage, then host-aware default.
  try {
    const qs = new URLSearchParams(location.search);
    const fromQuery = qs.get('gw');
    if (fromQuery) {
      localStorage.setItem('botler:gw:url', fromQuery);
      return fromQuery;
    }
  } catch {}
  const saved = localStorage.getItem('botler:gw:url');
  if (saved) return saved;
  // Netlify/remote host → fall back to loopback (user must override via UI or ?gw=).
  // Local host → same host on :18789.
  const h = location.hostname;
  if (!h || h === 'localhost' || h === '127.0.0.1' || /^\d+\.\d+\.\d+\.\d+$/.test(h)) {
    return `ws://${h || 'localhost'}:18789`;
  }
  return 'ws://localhost:18789';
}
const GW_URL     = resolveGatewayUrl();
const SESSION_KEY = 'agent:botler:main';
const FINANCE_PASSPHRASE = localStorage.getItem('botler:finance:pass') || null;

// ─── Gateway Client ───────────────────────────────────────────────────────────
class GatewayClient {
  constructor(url) {
    this._url      = url;
    this._ws       = null;
    this._pending  = new Map();  // reqId → { resolve, reject }
    this._handlers = {};
    this._seq      = 1;
    this._ready    = false;
    this._retryT   = null;
  }

  on(event, fn) { this._handlers[event] = fn; return this; }

  connect() {
    setDot('connecting');
    this._ws = new WebSocket(this._url);

    this._ws.onopen = () => {
      // wait for challenge
    };

    this._ws.onmessage = (ev) => {
      let f;
      try { f = JSON.parse(ev.data); } catch { return; }

      // Challenge/response handshake
      if (f.event === 'connect.challenge') {
        this._ws.send(JSON.stringify({ event: 'connect', payload: { challenge: f.payload?.challenge || '' } }));
        return;
      }
      if (f.event === 'connect.ack') {
        this._ready = true;
        setDot('connected');
        this._handlers['connect']?.();
        return;
      }

      // Resolve pending request
      if (f.reqId && this._pending.has(f.reqId)) {
        const { resolve, reject } = this._pending.get(f.reqId);
        this._pending.delete(f.reqId);
        if (f.error) reject(new Error(f.error.message || JSON.stringify(f.error)));
        else resolve(f.payload);
        return;
      }

      // Streaming events
      if (f.event) {
        this._handlers['event']?.(f);
      }
    };

    this._ws.onerror = () => {};

    this._ws.onclose = () => {
      this._ready = false;
      setDot('disconnected');
      this._handlers['disconnect']?.();
      clearTimeout(this._retryT);
      this._retryT = setTimeout(() => this.connect(), 4000);
    };
  }

  request(action, payload = {}) {
    return new Promise((resolve, reject) => {
      if (!this._ready) { reject(new Error('not connected')); return; }
      const reqId = String(this._seq++);
      this._pending.set(reqId, { resolve, reject });
      this._ws.send(JSON.stringify({ event: action, payload, reqId }));
      // timeout after 30s
      setTimeout(() => {
        if (this._pending.has(reqId)) {
          this._pending.delete(reqId);
          reject(new Error('timeout'));
        }
      }, 30000);
    });
  }
}

// ─── Gateway dot ─────────────────────────────────────────────────────────────
const gwDot = document.getElementById('gw-dot');
gwDot.title = `Gateway: ${GW_URL} (click to change)`;
gwDot.style.cursor = 'pointer';
function setDot(s) {
  gwDot.className = '';
  if (s === 'connected')   gwDot.classList.add('connected');
  if (s === 'connecting')  gwDot.classList.add('connecting');
}

// ─── Gateway URL override (used by Voice > Set Gateway…) ─────────────────────
window.setGatewayUrl = function () {
  const current = localStorage.getItem('botler:gw:url') || GW_URL;
  const next = prompt(
    'Gateway WebSocket URL\n(e.g. ws://192.168.x.y:18789 or ws://localhost:18789).\nLeave blank to clear.',
    current
  );
  if (next === null) return;
  if (!next.trim()) {
    localStorage.removeItem('botler:gw:url');
  } else {
    localStorage.setItem('botler:gw:url', next.trim());
  }
  location.reload();
};

// ─── Gateway instance ─────────────────────────────────────────────────────────
const gw = new GatewayClient(GW_URL);
let streamBuf = '';
let streamFinal = false;

gw.on('connect', () => {
  setTranscript('Ready.', true);
  setState('idle');
});
gw.on('disconnect', () => {
  setTranscript('Reconnecting…', false, 'tool');
});
gw.on('event', (f) => {
  if (f.event === 'chat')  _onChatEvent(f.payload);
  if (f.event === 'agent') _onAgentEvent(f.payload);
});
gw.connect();

// ─── CMD tag parser ───────────────────────────────────────────────────────────
function parseCmds(text) {
  const cmds = [];
  const clean = text.replace(/<cmd>([\s\S]*?)<\/cmd>/gi, (_, json) => {
    try { cmds.push(JSON.parse(json)); } catch(e) {}
    return '';
  });
  return { clean: clean.trim(), cmds };
}

// ─── Chat event handler ───────────────────────────────────────────────────────
let sentenceBuf = '';

function _resetStream() {
  streamBuf = '';
  streamFinal = false;
  sentenceBuf = '';
}

// Flush complete sentences from sentenceBuf to TTS queue as they accumulate.
function _flushSentences(incoming, forceAll) {
  sentenceBuf += incoming;
  const re = /[^.!?]*[.!?]+["'\u201d]?\s*/g;
  let last = 0, m;
  while ((m = re.exec(sentenceBuf)) !== null) {
    const s = m[0].trim();
    if (s.length > 3) enqueueTTS(s);
    last = m.index + m[0].length;
  }
  sentenceBuf = sentenceBuf.slice(last);
  if (forceAll && sentenceBuf.trim().length > 2) {
    enqueueTTS(sentenceBuf.trim());
    sentenceBuf = '';
  }
}

function _onChatEvent(p) {
  if (!p) return;
  const st = p.state;

  if (st === 'delta') {
    const { clean, cmds } = parseCmds(p.delta || '');
    streamBuf += clean;
    setTranscript(streamBuf, false);
    if (state === 'thinking') setState('thinking'); // stay thinking until first sentence queued
    cmds.forEach(executeTool);
    _flushSentences(clean, false);
  }
  else if (st === 'final') {
    const { clean, cmds } = parseCmds(p.text || streamBuf);
    streamBuf = '';
    setTranscript(clean, true);
    cmds.forEach(executeTool);
    _flushSentences('', true); // flush any leftover partial sentence
  }
  else if (st === 'error' || st === 'aborted') {
    _resetStream();
    stopTTS();
    setTranscript('Something went wrong. Try again.', true);
    setState('idle');
  }
}

// ─── Agent (tool) event handler ───────────────────────────────────────────────
function _onAgentEvent(p) {
  if (!p || p.stream !== 'tool') return;
  const phase = p.data?.phase;
  const toolName = p.data?.name ?? 'tool';
  if (phase === 'start') {
    setState('thinking');
    setTranscript(`Using: ${toolName}`, false, 'tool');
  } else if (phase === 'result') {
    if (state === 'thinking') setTranscript('Composing…', false, 'tool');
  }
}

// ─── Transcript display ───────────────────────────────────────────────────────
let transcriptTimer = null;
const transcriptEl = document.getElementById('transcript-panel');

function setTranscript(text, fade, type) {
  clearTimeout(transcriptTimer);
  transcriptEl.className = type === 'tool' ? 'tool-msg' : '';
  transcriptEl.textContent = text;
  transcriptEl.style.opacity = '1';
  if (fade && text) {
    transcriptTimer = setTimeout(() => {
      transcriptEl.style.opacity = '0';
      setTimeout(() => { transcriptEl.textContent = ''; }, 600);
    }, 6000);
  }
}

// ─── Send query to Botler ─────────────────────────────────────────────────────
async function askBotler(query, model = '') {
  if (!query || !query.trim()) return;
  _resetStream();
  setState('thinking');
  setTranscript(query, false, 'tool');
  try {
    const payload = {
      sessionKey: SESSION_KEY,
      agentId: 'botler',
      message: query,
      idempotencyKey: crypto.randomUUID(),
    };
    if (model) payload.model = model; // Add model override if provided
    await gw.request('chat.send', payload);
  } catch (err) {
    setTranscript('Gateway unavailable. Is the OpenClaw app running?', true);
    setState('idle');
  }
}

// ─── Text input ───────────────────────────────────────────────────────────────
const textInput = document.getElementById('text-input');
document.getElementById('text-send').addEventListener('click', () => {
  const q = textInput.value.trim();
  if (q) { textInput.value = ''; askBotler(q); }
});
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = textInput.value.trim();
    if (q) { textInput.value = ''; askBotler(q); }
  }
});

// ─── TTS system: bridge (macOS say) → speechSynthesis fallback ───────────────
const BRIDGE = 'http://localhost:8780';
let ttsUtter   = null;
let ttsQueue   = [];
let ttsSpeaking = false;

function pauseSTT() {
  if (recognition) { try { recognition.abort(); } catch {} }
}
function resumeSTT() {
  if (sttActive) { try { recognition && recognition.start(); } catch {} }
}

async function _tryBridgeTTS(text) {
  try {
    const r = await fetch(`${BRIDGE}/api/speak`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice: 'Daniel' }),
      signal: AbortSignal.timeout(4000),
    });
    if (!r.ok) return false;
    const d = await r.json();
    if (d.audio?.mode === 'file' && d.audio?.url) {
      return await new Promise((res) => {
        const a = new Audio(BRIDGE + d.audio.url);
        a.onended = () => res(true);
        a.onerror = () => res(false);
        a.play().catch(() => res(false));
      });
    }
  } catch { /* bridge not running */ }
  return false;
}

function _browserTTS(text) {
  return new Promise((res) => {
    if (!window.speechSynthesis) { res(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92; u.pitch = 0.88; u.volume = 1;
    ttsUtter = u;
    u.onboundary = (ev) => { if (ev.name === 'word') speakPhase += 0.35; };
    u.onend = u.onerror = () => { ttsUtter = null; res(); };
    window.speechSynthesis.speak(u);
  });
}

async function _drainTTS() {
  if (ttsSpeaking) return;
  ttsSpeaking = true;
  // Don't abort recognition — the `if (ttsSpeaking) return` guard in onresult
  // already suppresses echo. Aborting breaks the restart loop.
  while (ttsQueue.length) {
    const chunk = ttsQueue.shift();
    setState('speaking');
    const ok = await _tryBridgeTTS(chunk);
    if (!ok) await _browserTTS(chunk);
  }
  ttsSpeaking = false;
  setState('idle');
}

function enqueueTTS(text) {
  if (!text || !text.trim()) return;
  ttsQueue.push(text.trim());
  _drainTTS();
}

function speakText(text) {
  // Used by legacy callers — queue the whole thing.
  if (!text || !text.trim()) return;
  ttsQueue.push(text.trim());
  _drainTTS();
}

function stopTTS() {
  ttsQueue = [];
  ttsSpeaking = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  ttsUtter = null;
}

// ─── STT wake word ────────────────────────────────────────────────────────────
function handleVoiceCommand(query) {
  const lowerQuery = query.toLowerCase();
  if (lowerQuery.includes("open homeschool board") || lowerQuery.includes("open the homeschool board")) {
    executeTool({action: "homeschool", title: "Homeschool Board"});
    return "Homeschool board opened.";
  } else if (lowerQuery.includes("open finances")) {
    const match = lowerQuery.match(/pin\s*(\d{4})/);
    if (match && match[1]) {
        // Store pin to localStorage for promptless access
        localStorage.setItem('botler:finance:pass', match[1]);
        executeTool({action: "finance", title: "Finance Dashboard"});
        return "Finance dashboard opened and pin automatically set.";
    } else {
        executeTool({action: "finance", title: "Finance Dashboard"});
        return "Finance dashboard opened.";
    }
  } else if (lowerQuery.includes("change the color to")) {
    const colorMatch = lowerQuery.match(/change the color to\s*(\w+)/);
    if (colorMatch && colorMatch[1]) {
        let hex = '#ff8800'; // Default to orange
        switch(colorMatch[1]) {
            case 'blue': hex = '#0000ff'; break;
            case 'green': hex = '#00ff00'; break;
            case 'orange': hex = '#ff8800'; break;
            case 'red': hex = '#ff0000'; break;
            case 'purple': hex = '#800080'; break;
            case 'white': hex = '#ffffff'; break;
            case 'black': hex = '#000000'; break;
        }
        executeTool({action: "change_color", hex: hex});
        return `Color changed to ${colorMatch[1]}.`;
    }
  }
  return null; // Not a direct voice command
}

// ─── Wake chime ───────────────────────────────────────────────────────────────
function playWakeChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
    o.start(); o.stop(ctx.currentTime + 0.22);
  } catch {}
}

// ─── STT ──────────────────────────────────────────────────────────────────────
let sttActive = false;
let recognition = null;
const WAKE_WORDS = ['botler', 'hey botler', 'butler'];
const VOICE_MODEL = 'anthropic/claude-haiku-4-5';

function startSTT() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    console.warn('SpeechRecognition not available in this browser.');
    return;
  }

  let woke = false;
  let wakeTimer = null;

  function makeRecognition() {
    const r = new SR();
    r.continuous = true;
    r.interimResults = true;
    r.lang = 'en-US';

    r.onresult = (ev) => {
      // Don't process STT while Botler is speaking (echo prevention)
      if (ttsSpeaking) return;

      let interim = '', final = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) final += t + ' ';
        else interim += t + ' ';
      }
      const combined = (interim + final).toLowerCase();

      if (!woke) {
        if (WAKE_WORDS.some(w => combined.includes(w))) {
          woke = true;
          stopTTS(); // interrupt Botler if he's mid-sentence
          setState('listening');
          playWakeChime();
          setTranscript('Listening…', false, 'tool');
          clearTimeout(wakeTimer);
          wakeTimer = setTimeout(() => {
            woke = false;
            if (state === 'listening') setState('idle');
            setTranscript('', false);
          }, 12000);
        }
        return;
      }

      // Show live interim transcript while user is speaking
      if (interim.trim()) {
        setTranscript(interim.trim(), false, 'tool');
      }

      if (final.trim()) {
        let query = final.trim();
        // Strip wake words from start of utterance
        WAKE_WORDS.forEach(w => {
          query = query.replace(new RegExp('^' + w + '[,\\s]*', 'i'), '').trim();
        });
        if (query.length > 2) {
          woke = false;
          clearTimeout(wakeTimer);
          const localResponse = handleVoiceCommand(query);
          if (localResponse) {
            enqueueTTS(localResponse);
          } else {
            askBotler(query, VOICE_MODEL);
          }
        }
      }
    };

    r.onerror = (e) => {
      if (e.error === 'not-allowed') {
        setTranscript('Microphone access denied.', true, 'tool');
        sttActive = false;
      }
    };

    r.onend = () => {
      // Always restart while sttActive — onresult already ignores results
      // during TTS via the ttsSpeaking guard.
      if (sttActive) {
        setTimeout(() => { try { recognition.start(); } catch {} }, 300);
      }
    };

    return r;
  }

  recognition = makeRecognition();
  recognition.start();
  sttActive = true;
}

// Push-to-talk: click the face canvas to activate listening immediately
function pushToTalk() {
  if (!sttActive) { startSTT(); return; }
  if (ttsSpeaking) { stopTTS(); resumeSTT(); }
  // Treat as wake — skip wake word requirement for this turn
  if (recognition) {
    try { recognition.abort(); } catch {}
  }
  recognition = (function() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.continuous = false; r.interimResults = true; r.lang = 'en-US';
    r.onresult = (ev) => {
      if (ttsSpeaking) return;
      let final = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        if (ev.results[i].isFinal) final += ev.results[i][0].transcript + ' ';
        else setTranscript(ev.results[i][0].transcript, false, 'tool');
      }
      if (final.trim()) {
        setTranscript(final.trim(), false, 'tool');
        const local = handleVoiceCommand(final.trim());
        if (local) enqueueTTS(local);
        else askBotler(final.trim(), VOICE_MODEL);
      }
    };
    r.onerror = () => {};
    r.onend = () => {
      // hand back to the persistent wake-word listener
      sttActive = false;
      startSTT();
    };
    return r;
  })();
  if (!recognition) return;
  setState('listening');
  playWakeChime();
  setTranscript('Listening…', false, 'tool');
  recognition.start();
}

function executeTool(cmd) {
  if (!cmd || !cmd.action) return;
  switch (cmd.action) {
    case 'render_component': renderComponent(cmd); break;
    case 'shopping_list':    renderShoppingList(cmd); break;
    case 'browser':          openBrowser(cmd); break;
    case 'finance':          openFinance(cmd); break;
    case 'homeschool':       openHomeschool(cmd); break; // New: Open Homeschool tab
    case 'close_panel':      closeToolPanel(); break;
    default: console.log('Unknown cmd action:', cmd.action, cmd);
  }
}

  const panel = document.getElementById('tool-panel');

  ).join('');

// ─── Chain physics ────────────────────────────────────────────────────────────
const CHAIN_LINKS = 4;
const chainPts    = Array.from({length:CHAIN_LINKS}, () => ({x:0,y:0,vx:0,vy:0}));
let   chainMeshes = [];

function initChainPositions() {
  const R  = EYE_R();
  const ld = R * 0.38;
  chainPts.forEach((p, i) => {
    p.x = 0; p.y = -(R * 1.35 + i * ld); p.vx = 0; p.vy = 0;
  });
}

function stepChain(eyeWX, eyeWY, effectiveMonoScale) {
  const R  = EYE_R();
  const ld = R * 0.38;
  const anchorX = eyeWX;
  const anchorY = eyeWY - R * 1.35 * effectiveMonoScale;
  chainPts.forEach((p, i) => {
    const prevX = i === 0 ? anchorX : chainPts[i-1].x;
    const prevY = i === 0 ? anchorY : chainPts[i-1].y;
    const dx = p.x - prevX, dy = p.y - prevY;
    const dist = Math.sqrt(dx*dx + dy*dy) || 0.0001;
    const stretch = dist - ld;
    p.vx -= (dx/dist) * stretch * 0.32;
    p.vy -= (dy/dist) * stretch * 0.32;
    p.vy -= 0.007;
    p.vx *= 0.80; p.vy *= 0.80;
    p.x  += p.vx; p.y  += p.vy;
  });
  chainMeshes.forEach((m, i) => {
    m.position.x = chainPts[i].x;
    m.position.y = chainPts[i].y;
  });
}

  dot.add(glint);

  let monoGroup = null;
  if (withMonocle) {
    monoGroup = new THREE.Group();
    g.add(monoGroup);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(R * 1.12, R * 1.35, 56),
      new THREE.MeshBasicMaterial({ color: 0xd4a030, side: THREE.DoubleSide })
    );
    ring.position.z = 0.003;
    monoGroup.add(ring);

    const tlG = new THREE.Mesh(
      new THREE.RingGeometry(R*1.10, R*1.37, 20, 1, 1.92, 1.05),

    );
    tlG.position.z = 0.005;

    );

    initChainPositions();

    chainMeshes = [];

  }

}

// ─── Mustache ────────────────────────────────────────────────────────────────
const mustacheGroup = new THREE.Group();

function buildMustache() {
  while (mustacheGroup.children.length) mustacheGroup.remove(mustacheGroup.children[0]);
  const th  = LIP_TH() * 1.3 * 1.25 * 0.5;
  const hw  = HW();
  const mat = new THREE.MeshBasicMaterial({ color: 0x100400 });
  ;[-1, 1].forEach(xs => {
    const gap       = hw * 0.225;
    const length    = hw * 1.2;
    const thickness = th;
    const shape     = new THREE.Shape();
    shape.moveTo(xs * gap,             thickness);
    shape.lineTo(xs * gap,            -thickness * 0.2);
    shape.lineTo(xs * (gap + length),  thickness * 0.5);
    shape.closePath();
    const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat);
    mesh.position.z  = 0.01;
    mesh.rotation.z  = xs * (-6 * Math.PI / 180);
    mustacheGroup.add(mesh);
  });
}

// ─── Mouth ───────────────────────────────────────────────────────────────────
const mouthGroup = new THREE.Group();

function buildMouth(smile, openness) {
  while (mouthGroup.children.length) mouthGroup.remove(mouthGroup.children[0]);
  const hw   = HW();
  const lift = smile * 0.13;
  const drop = openness * 0.095;
  const th   = LIP_TH();
  const N    = 60;
  const mat  = new THREE.MeshBasicMaterial({ color: 0x160500 });

  const uL = new THREE.Vector3(-hw, 0, 0);
  const uC = new THREE.Vector3(0,  lift + drop * 0.15, 0);
  const uR = new THREE.Vector3( hw, 0, 0);
  const lC = new THREE.Vector3(0,  lift - drop, 0);

  const uPts = new THREE.QuadraticBezierCurve3(uL, uC, uR).getPoints(N);
  const lPts = new THREE.QuadraticBezierCurve3(uL, lC, uR).getPoints(N);

  if (openness > 0.04) {
    const shape = new THREE.Shape();
    shape.moveTo(uPts[0].x, uPts[0].y);
    uPts.forEach(p => shape.lineTo(p.x, p.y));
    for (let i = lPts.length-1; i >= 0; i--) shape.lineTo(lPts[i].x, lPts[i].y);
    shape.closePath();
    mouthGroup.add(new THREE.Mesh(new THREE.ShapeGeometry(shape),
      new THREE.MeshBasicMaterial({ color:0x060100 })));
    mouthGroup.add(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lPts.map(p=>new THREE.Vector3(p.x,p.y,0.002))),N,th,8,false), mat));
  }
  mouthGroup.add(new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(uPts.map(p=>new THREE.Vector3(p.x,p.y,0.002))),N,th,8,false), mat));
}

// ─── Edit drag system ─────────────────────────────────────────────────────────
function getXY(e) {
  return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY }
                   : { x: e.clientX,             y: e.clientY };

function startDrag(id, e) {

function onDragMove(e) {

  const dsy = -dy / innerHeight * 2;
  switch (drag.id) {
    case 'mst-box':    edit.mustacheY  = drag.snap.mustacheY + dsy; break;
    case 'mst-corner': edit.mustacheSX = Math.max(0.2, drag.snap.mustacheSX + dx / 280); break;
    case 'mst-height': edit.mustacheSY = Math.max(0.1, drag.snap.mustacheSY - dy / 260); break;
    case 'eye-pos':
      edit.eyeY      = drag.snap.eyeY + dsy;
      edit.eyeSepOff = drag.snap.eyeSepOff - (dx / innerWidth) * aspect * 1.2;
      break;
    case 'eye-sz':  edit.eyeSize  = Math.max(0.15, drag.snap.eyeSize + dx / 280); break;
    case 'mono-sz': edit.monoSize = Math.max(0.2,  drag.snap.monoSize - dy / 260); break;
  }
}
function onDragEnd() { drag = null; }

document.addEventListener('mousemove', onDragMove);
document.addEventListener('mouseup',   onDragEnd);
document.addEventListener('touchmove', onDragMove, { passive: false });
document.addEventListener('touchend',  onDragEnd);

['mst-box','mst-corner','mst-height','eye-pos','eye-sz','mono-sz'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('mousedown',  e => startDrag(id, e));
  el.addEventListener('touchstart', e => startDrag(id, e), { passive: false });
});

function toggleEdit() {
  editMode = !editMode;
  document.getElementById('edit-ui').style.display = editMode ? 'block' : 'none';
  const eb = document.getElementById('edit-btn');
  eb.textContent = editMode ? 'Done' : 'Edit';
  eb.classList.toggle('active', editMode);
}

// ─── Color Picker ─────────────────────────────────────────────────────────────
const SWATCHES = [
  '#ff8800','#ff4422','#ff2266','#cc44ff','#4455ff',
  '#00aaff','#00cc88','#aacc00','#ffcc00','#ffffff',
  '#ff6600','#884400','#002233','#1a0800','#333333',
];
let colorPanelOpen = false;

function applyColor(hex) {
  const c = new THREE.Color(hex);
  bgMat.uniforms.tint.value.set(c);
  document.querySelectorAll('.swatch').forEach(s =>
    s.classList.toggle('active', s.dataset.hex === hex));
}

function toggleColorPanel(e) {
  e.stopPropagation();
  if (activeDropdownId) {
    document.getElementById(activeDropdownId).classList.remove('open');
    activeDropdownId = null;
  }
  colorPanelOpen = !colorPanelOpen;
  document.getElementById('color-panel').classList.toggle('open', colorPanelOpen);
}

document.addEventListener('click', (event) => {
  document.querySelectorAll('.dropdown-menu').forEach(menu => {
    if (menu.classList.contains('open') && !menu.contains(event.target)) {
      menu.classList.remove('open');
    }
  });
  activeDropdownId = null;
  const colorPanel = document.getElementById('color-panel');
  const colorPickerLink = document.getElementById('color-picker-link');
  if (colorPanelOpen && !colorPanel.contains(event.target) && (!colorPickerLink || !colorPickerLink.contains(event.target))) {
    colorPanelOpen = false;
    colorPanel.classList.remove('open');
  }
});

const swatchContainer = document.getElementById('color-swatches');
SWATCHES.forEach(hex => {
  const s = document.createElement('div');
  s.className = 'swatch';
  s.dataset.hex = hex;
  s.style.background = hex;
  if (hex === '#ff8800') s.classList.add('active');
  s.addEventListener('click', e => { e.stopPropagation(); applyColor(hex); });
  swatchContainer.appendChild(s);
});

const specCanvas = document.getElementById('color-spectrum');
const specCtx    = specCanvas.getContext('2d');
(function drawSpectrum() {
  const grad = specCtx.createLinearGradient(0, 0, 200, 0);
  for (let i = 0; i <= 360; i += 30) grad.addColorStop(i/360, `hsl(${i},100%,50%)`);
  specCtx.fillStyle = grad;
  specCtx.fillRect(0, 0, 200, 16);
})();

function pickSpectrum(e) {
  e.stopPropagation();
  const rect = specCanvas.getBoundingClientRect();
  const cx   = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const pct  = Math.max(0, Math.min(1, cx / rect.width));
  const hue  = Math.round(pct * 360);
  const hex  = `hsl(${hue},100%,50%)`;
  const c    = new THREE.Color(hex);
  bgMat.uniforms.tint.value.set(c);
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
}
specCanvas.addEventListener('click', pickSpectrum);
specCanvas.addEventListener('mousemove', e => { if (e.buttons === 1) pickSpectrum(e); });
specCanvas.addEventListener('touchmove', e => { e.stopPropagation(); pickSpectrum(e); }, { passive: false });

// ─── Update edit handles ──────────────────────────────────────────────────────
function updateEditUI() {
  if (!editMode) return;
  const hw  = HW();
  const mstHW  = hw * (0.225 + 1.2);
  const mstHH  = LIP_TH() * 1.3 * 1.25 * 0.5 * 1.2;
  const mstCY  = mustacheGroup.position.y;

  const tl = toScreen(-mstHW * edit.mustacheSX, mstCY + mstHH * edit.mustacheSY);
  const br = toScreen( mstHW * edit.mustacheSX, mstCY - mstHH * edit.mustacheSY);
  const bW = Math.max(40, br.x - tl.x);
  const bH = Math.max(24, br.y - tl.y);

  const box = document.getElementById('mst-box');
  box.style.left = tl.x+'px'; box.style.top = tl.y+'px';
  box.style.width = bW+'px';  box.style.height = bH+'px';

  const cor = document.getElementById('mst-corner');
  cor.style.left = (tl.x+bW)+'px'; cor.style.top = (tl.y+bH)+'px';

  const mh = document.getElementById('mst-height');
  mh.style.left = (tl.x+bW)+'px'; mh.style.top = (tl.y+bH/2)+'px';
  document.getElementById('lbl-mh').style.left = (tl.x+bW+14)+'px';
  document.getElementById('lbl-mh').style.top  = (tl.y+bH/2-6)+'px';

  const lm = document.getElementById('lbl-mst');
  lm.style.left = (tl.x+bW/2)+'px'; lm.style.top = (tl.y-16)+'px';

  const leS    = toScreen(leftEye.g.position.x, leftEye.g.position.y);
  const eyePxR = EYE_R() * edit.eyeSize * innerHeight / 2;

  const ep = document.getElementById('eye-pos');
  ep.style.left = leS.x+'px'; ep.style.top = leS.y+'px';

  const esz = document.getElementById('eye-sz');
  esz.style.left = (leS.x-eyePxR-18)+'px'; esz.style.top = leS.y+'px';

  document.getElementById('lbl-eye').style.left = leS.x+'px';
  document.getElementById('lbl-eye').style.top  = (leS.y-eyePxR-18)+'px';
  document.getElementById('lbl-esz').style.left = (leS.x-eyePxR-18)+'px';
  document.getElementById('lbl-esz').style.top  = (leS.y+14)+'px';

  const reS     = toScreen(rightEye.g.position.x, rightEye.g.position.y);
  const monoPxR = EYE_R() * 1.35 * edit.eyeSize * edit.monoSize * innerHeight / 2;

  const msz = document.getElementById('mono-sz');
  msz.style.left = reS.x+'px'; msz.style.top = (reS.y-monoPxR-18)+'px';

  const lmo = document.getElementById('lbl-mono');
  lmo.style.left = (reS.x+monoPxR+8)+'px'; lmo.style.top = (reS.y-monoPxR-20)+'px';
}

// ─── Animate ─────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let speakPhase = 0;

function animate() {
  requestAnimationFrame(animate);
  const t  = clock.getElapsedTime();
  const dt = 0.016;

  bgMat.uniforms.time.value   = t;
  bgMat.uniforms.aspect.value = aspect;

  const fy = Math.sin(t * 0.55) * 0.022;

  if (!drag) {
    look.x += (mouse.x - look.x) * 0.055;
    look.y += (mouse.y - look.y) * 0.055;
  }

  const driftX = state === 'thinking' ? Math.sin(t * 1.05) * 0.03 : look.x * 0.012;
  const driftY = state === 'thinking' ? 0 : look.y * 0.008;

  const eyeWY = EYE_Y() + fy + driftY + edit.eyeY;

  ;[leftEye, rightEye].forEach(eye => {
    eye.g.position.x = eye.xSign * (EYE_SEP() + edit.eyeSepOff) + driftX;
    eye.g.position.y = eyeWY;
    eye.g.position.z = 0.1;
    eye.g.scale.set(edit.eyeSize, edit.eyeSize, 1);
  });

  if (rightEye.monoGroup) {
    rightEye.monoGroup.scale.set(edit.monoSize, edit.monoSize, 1);
    const parallax = look.x * 0.18 + look.y * 0.10;
    rightEye.monoGroup.children[1].rotation.z = -parallax;
    rightEye.monoGroup.children[2].rotation.z = -parallax;
  }

  stepChain(rightEye.g.position.x, rightEye.g.position.y, edit.eyeSize * edit.monoSize);

  const my       = MOUTH_Y() + fy;
  const mustacheH = LIP_TH() * 1.3 * 1.25 * 0.5;
  mouthGroup.position.y     = my;
  mustacheGroup.position.y  = my + mustacheH * 2.2 + edit.mustacheY;
  mustacheGroup.position.x  = 0;
  mustacheGroup.scale.set(edit.mustacheSX, edit.mustacheSY, 1);

  blinkTimer += dt;
  if (!blinking && blinkTimer > blinkInterval) {
    blinking = true; blinkTimer = 0;
    blinkInterval = 2.5 + Math.random() * 4;
  }
  if (blinking) {
    blinkProg += 0.15;
    const b = Math.sin(blinkProg * Math.PI);
    ;[leftEye, rightEye].forEach(eye => { eye.dot.scale.y = 1 - b * 0.90; });
    if (blinkProg >= 1) {
      blinking = false; blinkProg = 0;
      ;[leftEye, rightEye].forEach(eye => { eye.dot.scale.y = 1; });
    }
  }

  if (state === 'speaking') {
    speakPhase += 0.11;
    const o = (Math.sin(speakPhase) * 0.42 + Math.sin(speakPhase * 2.3) * 0.16 + 0.58) * 0.48;
    buildMouth(0.5, Math.max(0, o));
  }

  const pa = pGeo.attributes.position.array;
  for (let i = 0; i < PN; i++) {
    pa[i*3+1] += pSpd[i];
    if (pa[i*3+1] >  1.15) pa[i*3+1] = -1.15;
    if (pa[i*3+1] < -1.15) pa[i*3+1] =  1.15;
  }
  pGeo.attributes.position.needsUpdate = true;

  updateEditUI();

  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.render(scene, camera);
}
animate();

// ─── Resize ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  aspect = innerWidth / innerHeight;
  renderer.setSize(innerWidth, innerHeight);
  camera = makeCamera();
  buildMouth(SMILES[state], OPEN[state]);
  buildMustache();
  initChainPositions();
});
</script>
