<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botler Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, serif; background: #120700; color: #f5d49a; }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; gap: 10px; align-items: center; justify-content: center;
      padding: 12px; background: rgba(12, 5, 0, 0.88); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 170, 70, 0.16);
    }
    .btn {
      background: rgba(255,160,40,0.08); border: 1px solid rgba(255,160,40,0.22);
      color: rgba(255,220,140,0.88); font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; padding: 8px 14px; cursor: pointer;
    }
    .btn.active { background: rgba(255,160,40,0.18); }
    .frame-wrap { position: fixed; inset: 56px 0 0 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #120700; }
    .note {
      position: fixed; right: 12px; bottom: 12px; z-index: 12;
      background: rgba(12,5,0,0.84); border: 1px solid rgba(255,160,40,0.16);
      color: rgba(255,220,160,0.75); padding: 10px 12px; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="btn active" data-src="./index.html">Botler</button>
    <button class="btn" data-src="https://family-binder.netlify.app">Binder</button>
    <button class="btn" data-src="https://homeschool-board.netlify.app">School</button>
    <button class="btn" data-src="./voice.html">Voice</button>
  </div>
  <div class="frame-wrap">
    <iframe id="frame" src="./index.html" allow="camera; microphone; fullscreen; autoplay"></iframe>
  </div>
  <div class="note">Botler Portal — face, binder, school board, voice.</div>
  <script>
    const frame = document.getElementById('frame');
    const buttons = [...document.querySelectorAll('.btn')];
    const host = window.location.hostname || '127.0.0.1';

    buttons.forEach(btn => {
      if (btn.dataset.srcTemplate) btn.dataset.src = btn.dataset.srcTemplate.replace('{host}', host);
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        frame.src = btn.dataset.src;
      });
    });
  </script>
</body>
</html>
